<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>

  <!-- Kafka topology lines (producer → broker → consumer) -->
  <line x1="16" y1="11" x2="9"  y2="21" stroke="#f97316" stroke-width="1.3" opacity="0.45"/>
  <line x1="16" y1="11" x2="23" y2="21" stroke="#f97316" stroke-width="1.3" opacity="0.45"/>

  <!-- In-flight message blocks riding the lines -->
  <rect x="11.5" y="14.5" width="3" height="3" rx="0.8" fill="#fb923c"/>
  <rect x="17.5" y="14.5" width="3" height="3" rx="0.8" fill="#22c55e"/>

  <!-- Top node: broker (solid Kafka orange) -->
  <circle cx="16" cy="7.5" r="4.5" fill="#f97316"/>

  <!-- Bottom-left: producer node — hollow + stacked queue lines inside -->
  <circle cx="8"  cy="25" r="4.2" fill="#1a1a2e" stroke="#f97316" stroke-width="1.5"/>
  <rect x="5.5" y="23.5" width="5"   height="1.2" rx="0.4" fill="#f97316" opacity="0.9"/>
  <rect x="6.5" y="25.5" width="3"   height="1.2" rx="0.4" fill="#f97316" opacity="0.5"/>

  <!-- Bottom-right: consumer node — hollow + stacked queue lines inside -->
  <circle cx="24" cy="25" r="4.2" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="21.5" y="23.5" width="5"  height="1.2" rx="0.4" fill="#8b5cf6" opacity="0.9"/>
  <rect x="22.5" y="25.5" width="3"  height="1.2" rx="0.4" fill="#8b5cf6" opacity="0.5"/>
</svg>
